<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>FBI Secure Personnel Portal</title>

<style>

html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:var(--tx)}
.btn{background:var(--gold);color:#111;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}

.seal{width:84px;height:84px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-weight:700;font-size:26px;letter-spacing:2px;box-shadow:0 0 30px #c9a24b33}

.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px}
#lc{width:min(380px,92vw);display:flex;flex-direction:column;gap:12px}
#lc h1{margin:0;font-size:17px;letter-spacing:2px;text-align:center}#lc small{text-align:center;color:var(--gold);letter-spacing:3px}
.err{color:var(--bad);font-size:13px;min-height:18px}.foot{color:var(--mut);font-size:11px;letter-spacing:1.5px;text-align:center;max-width:92vw}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;background:none;border:0;color:var(--gold);cursor:pointer}
#app{display:none;min-height:100vh}

#top{display:none;position:sticky;top:0;background:var(--panel);padding:10px 14px;border-bottom:1px solid var(--line);z-index:5;align-items:center;gap:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.stat b{display:block;font-size:26px;color:var(--gold)}.stat span{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.tools>*{width:auto;flex:1 1 140px}.tools .btn{flex:0 0 auto}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-size:12px;text-transform:uppercase;cursor:pointer}tr.cl:hover{background:var(--panel2);cursor:pointer}
.pill{padding:2px 8px;border-radius:10px;font-size:12px;background:#1e2d4d}.pill.ok{background:#1b4a38}.pill.bad{background:#5a2422}.pill.warn{background:#5a4318}
h2{margin:0 0 4px}.mut{color:var(--mut)}
#modal{display:none;position:fixed;inset:0;background:#000a;z-index:20;align-items:center;justify-content:center;padding:16px}#modal .card{width:min(460px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
@media(max-width:800px){#side{transform:translateX(-100%);transition:.2s;z-index:10}#side.o{transform:none}#main{margin-left:0;padding:14px}#top{display:flex}}
[dir=rtl] #side{left:auto;right:0;border-right:0;border-left:1px solid var(--line)}[dir=rtl] #main{margin-left:0;margin-right:220px}[dir=rtl] th,[dir=rtl] td{text-align:right}[dir=rtl] .pw button{right:auto;left:6px}[dir=rtl] #side a:hover,[dir=rtl] #side a.on{box-shadow:inset -3px 0 var(--gold)}[dir=rtl] body,[dir=rtl] button,[dir=rtl] input,[dir=rtl] select{font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif}
@media(max-width:800px){[dir=rtl] #side{transform:translateX(100%)}[dir=rtl] #side.o{transform:none}[dir=rtl] #main{margin-right:0}}
</style></head><body>

${rows.length?rows.map(([r,i])=>`<tr class="cl" onclick="${page=="roster"?"prof":"det"}(${i})">${r.map((v,j)=>`<td>${j==c.pill?`<span class="pill ${pc(v)}">${esc(v)}</span>`:esc(v)}</td>`).join("")}<td onclick="event.stopPropagation()">${page=="reports"&&can("review")?`<button class="btn s k" onclick="st(${i},'Approved')">Approve</button> <button class="btn s r" onclick="st(${i},'Rejected')">Reject</button> `:""}${can("delete")?`<button class="btn s g" onclick="del(${i})">Delete</button>`:""}</td></tr>`).join(""):`<tr><td colspan="${c.c.length+1}" class="mut">No records found.</td></tr>`}</table></div>`;
const s=$("sq");if(s&&q){s.focus();s.setSelectionRange(q.length,q.length)}}
function clock(){const e=$("clk");if(!e||page!="dashboard")return;e.textContent=new Date().toLocaleString(lang=="ar"?"ar-EG":undefined);setTimeout(clock,1000)}
function st(i,v){D.reports[i][6]=v;note(v+" "+D.reports[i][0]);render()}
const X={"reports:R-1042":{desc:"Armed robbery at the downtown bank; two suspects fled east in a black sedan.",people:"Tom Briggs, Victor Reyes",evid:"EV-4471 (CCTV), EV-4472 (casings)",notes:""},"ops:OP-SENTINEL":{brief:"Surveillance of the Pier 9 warehouse district.",obj:"1. Identify contacts\n2. Secure the dock\n3. No civilian exposure",aar:""},"cases:C-2026-07":{susp:"Rico “Ghost” Salvatore",evid:"EV-3310",notes:"Informant confirmed a shipment on the 30th.",time:"10-12 Tip received\n10-20 Surveillance started"}};
const F={reports:[["Description","desc"],["Involved Personnel","people"],["Evidence References","evid"],["Supervisor Notes","notes"]],cases:[["Suspects / Persons of Interest","susp"],["Evidence References","evid"],["Investigation Notes","notes"],["Timeline","time"]],ops:[["Briefing Notes","brief"],["Mission Objectives","obj"],["After-Action Report","aar"]],wanted:[["Details","desc"],["Last Known Location","loc"]]};
const SB={reports:[["Approved","Approve"],["Rejected","Reject"]],cases:[["Open","Reopen"],["Closed","Close Case"]],ops:[["Planned","Planned"],["Active","Start"],["Completed","Complete"]],wanted:[["Captured","Captured"],["At Large","At Large"]]};
function xo(i){const r=D[page][i],k=page+":"+r[0];return X[k]=X[k]||{h:[]}}
function det(i){const r=D[page][i],c=P[page],x=xo(i),rv=can("review"),ed=rv||(page=="reports"&&r[3]==me.name);
if(page=="cases"&&r[5]=="Yes"&&!can("confidential"))return;
modal(`<h2>${esc(page=="ann"||page=="attendance"?r[0]:r[1])}</h2>`+c.c.map((h,j)=>`<div><span class="mut">${t(h)}:</span> ${j==c.pill?`<span class="pill ${pc(r[j])}">${esc(r[j])}</span>`:esc(r[j])}</div>`).join("")+(F[page]||[]).map(([h,f])=>`<label class="mut">${t(h)}</label><textarea id="x_${f}" rows="3" ${ed?"":"disabled"}>${esc(x[f]||"")}</textarea>`).join("")+(rv&&SB[page]?`<div class="tools">`+SB[page].map(s=>`<button class="btn s g" onclick="stat(${i},'${s[0]}')">${t(s[1])}</button>`).join("")+`</div>`:"")+(F[page]?`<div class="mut">${t("History")}</div>`+(x.h.length?x.h.map(h=>`<div class="mut">${esc(h)}</div>`).join(""):`<div class="mut">—</div>`):"")+`<div class="tools">${ed&&F[page]?`<button class="btn" onclick="sv(${i})">${t("Save")}</button>`:""}<button class="btn g" onclick="$('modal').style.display='none'">${t("Close")}</button></div>`)}
function sv(i){const x=xo(i);F[page].forEach(([h,f])=>x[f]=$("x_"+f).value);x.h.unshift(new Date().toLocaleString()+" · "+me.name+" · saved");note("Updated "+D[page][i][0]);det(i)}
function stat(i,v){const r=D[page][i],x=xo(i);r[P[page].f]=v;x.h.unshift(new Date().toLocaleString()+" · "+me.name+" · "+v);note(v+" "+r[0]);render();det(i)}
function del(i){if(confirm(t("Delete this record?"))){note("Deleted record in "+P[page].t);D[page].splice(i,1);render()}}
function modal(h){$("mc").innerHTML=h;tr($("mc"));$("modal").style.display="flex"}
$("modal").onclick=e=>{if(e.target.id=="modal")$("modal").style.display="none"};
function prof(i){const r=D.roster[i],c=P.roster.c;modal(`<div class="seal" style="width:60px;height:60px;font-size:18px">${r[1].split(" ").map(x=>x[0]).join("")}</div><h2>${esc(r[1])}</h2>`+c.map((h,j)=>`<div><span class="mut">${t(h)}:</span> ${esc(r[j])}</div>`).join("")+`<div><span class="mut">Awards:</span> Meritorious Service</div>${can("manage")?`<div><span class="mut">Disciplinary:</span> None on file</div>`:""}<button class="btn g" onclick="$('modal').style.display='none'">Close</button>`)}
function addF(){const c=P[page].c;modal(`<h2>${t("Add")} — ${t(P[page].t)}</h2><form onsubmit="return addS(event)" style="display:flex;flex-direction:column;gap:8px">`+c.map((h,j)=>`<input name="f${j}" placeholder="${h}" required>`).join("")+`<button class="btn">Save</button></form>`)}
function addS(e){e.preventDefault();const v=[...new FormData(e.target).values()].map(x=>x.trim());if(v.some(x=>!x))return false;
D[page].push(v);note("Added record in "+P[page].t);$("modal").style.display="none";render();return false}
function csv(){const t=[P.roster.c,...D.roster].map(r=>r.map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")).join("\n");
const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(t);a.download="roster.csv";a.click()}
applyL();boot();
</script></body></html>
